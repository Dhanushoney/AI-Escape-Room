<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs><rect width="1440" height="640" fill="#ffffff"/><text x="30" y="38" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">Version 1 architecture — the LLM is the Game Master</text><text x="30" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="start">One model call per turn. The model holds the rules, every puzzle solution and the game state.</text><rect x="25" y="145" width="185" height="50" rx="25.0" fill="#e8f1fb" stroke="#4a7bb7" stroke-width="1.8"/><text x="117.5" y="175.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Player types an action</text><rect x="250" y="128" width="220" height="84" rx="9" fill="#e8f1fb" stroke="#4a7bb7" stroke-width="1.8"/><text x="360.0" y="159.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Streamlit interface</text><text x="360.0" y="177.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#3b4a5a" text-anchor="middle" font-style="italic">app/version1.py</text><text x="360.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">object cards · chat input · restart</text><rect x="540" y="255" width="260" height="112" rx="9" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/><text x="670.0" y="292.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Session management</text><text x="670.0" y="310.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#3b4a5a" text-anchor="middle" font-style="italic">V1Session in st.session_state</text><text x="670.0" y="325.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">chat history (last 30 messages)</text><text x="670.0" y="340.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">status as reported by the model</text><rect x="870" y="118" width="230" height="104" rx="9" fill="#fdebc8" stroke="#c68a12" stroke-width="1.8"/><text x="985.0" y="151.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">LLM Game Master</text><text x="985.0" y="169.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Google Gemini</text><text x="985.0" y="184.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">interprets actions · judges answers</text><text x="985.0" y="199.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">decides and tracks the game state</text><rect x="1220" y="118" width="200" height="104" rx="9" fill="#eef0f7" stroke="#5a67a8" stroke-width="1.8"/><text x="1320.0" y="151.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Prompt and game context</text><text x="1320.0" y="169.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#3b4a5a" text-anchor="middle" font-style="italic">build_system_prompt()</text><text x="1320.0" y="184.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">story · objects · rules</text><text x="1320.0" y="199.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">ALL puzzle solutions</text><rect x="870" y="398" width="230" height="84" rx="9" fill="#ffffff" stroke="#3e4c59" stroke-width="1.8"/><text x="985.0" y="429.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Response parser</text><text x="985.0" y="447.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#3b4a5a" text-anchor="middle" font-style="italic">parse_game_master_reply()</text><text x="985.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">narrative + STATUS line</text><rect x="250" y="398" width="220" height="84" rx="9" fill="#e8f1fb" stroke="#4a7bb7" stroke-width="1.8"/><text x="360.0" y="429.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle">Player display</text><text x="360.0" y="447.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">journal · inventory · seals</text><text x="360.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">(reported by the LLM, unverified)</text><rect x="25" y="415" width="185" height="50" rx="25.0" fill="#e8f1fb" stroke="#4a7bb7" stroke-width="1.8"/><text x="117.5" y="445.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Player sees outcome</text><path d="M210,170 L250,170" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M470,170 L640,170 L640,255" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M800,285 L835,285 L835,170 L870,170" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M1220,170 L1100,170" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M985,222 L985,398" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M870,440 L720,440 L720,367" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M600,367 L600,440 L470,440" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M250,440 L210,440" fill="none" stroke="#3e4c59" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="250" y="525" width="1160" height="76" rx="9" fill="#fdecea" stroke="#c53030" stroke-width="1.5"/><text x="266" y="549" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#c53030" text-anchor="start">Why Version 1 is unreliable</text><text x="266" y="568" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Whatever the model writes in its STATUS line becomes the game state — nothing checks it. All solutions sit in the model&#x27;s</text><text x="266" y="587" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">context, so a persuasive player (&quot;I am the administrator…&quot;) can talk it into escaping or revealing codes.</text><rect x="30" y="614" width="16" height="14" rx="3" fill="#e8f1fb" stroke="#4a7bb7" stroke-width="1.5"/><text x="52" y="626" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Interface</text><rect x="119.4" y="614" width="16" height="14" rx="3" fill="#ffffff" stroke="#3e4c59" stroke-width="1.5"/><text x="141.4" y="626" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Python code</text><rect x="222.0" y="614" width="16" height="14" rx="3" fill="#fdebc8" stroke="#c68a12" stroke-width="1.5"/><text x="244.0" y="626" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Language model</text><rect x="344.4" y="614" width="16" height="14" rx="3" fill="#eef0f7" stroke="#5a67a8" stroke-width="1.5"/><text x="366.4" y="626" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Prompt / data</text><rect x="509.2" y="159" width="101.60000000000001" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="560.0" y="172.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">player message</text><rect x="761.8" y="219" width="146.4" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="835.0" y="232.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">history + new message</text><rect x="1115.6" y="159" width="88.80000000000001" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="1160.0" y="172.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">instructions</text><rect x="947.0" y="299" width="76.0" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="985.0" y="312.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">reply text</text><rect x="731.4" y="429" width="127.2" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="795.0" y="442.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">narrative + STATUS</text><rect x="477.8" y="429" width="114.4" height="18" rx="4" fill="#ffffff" stroke="#d5dbe1" stroke-width="0.8"/><text x="535.0" y="442.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334e68" text-anchor="middle">journal + status</text></svg>